; WiFi LAN Scanner toolchain baseline.
; The compile environment uses PlatformIO's existing LilyGo T-Display-S3 board id.
; T-Display-S3-Pro peripheral pin mappings are intentionally deferred.
; This baseline is compile-only. Do not upload or flash firmware.

[env:lilygo-t-display-s3]
platform = espressif32
board = lilygo-t-display-s3
framework = arduino
monitor_speed = 115200
