; WiFi LAN Scanner foundation for the LILYGO T-Display-S3-Pro.
; The PlatformIO board id lilygo-t-display-s3 selects the ESP32-S3, 16MB flash,
; and USB identification used by this family. Pro panel pins are in include/BoardConfig.h.
; Upload port is intentionally not pinned here. Pass --upload-port only after the
; connected ESP32-S3 is identified as the intended T-Display-S3-Pro.

[platformio]
default_envs = lilygo-t-display-s3-pro

[env:lilygo-t-display-s3-pro]
platform = espressif32@7.1.3
board = lilygo-t-display-s3
framework = arduino
monitor_speed = 115200
lib_deps =
  moononournation/GFX Library for Arduino@1.4.6
; The installed lilygo-t-display-s3 board already records qio_opi. Repeat it here
; so this project, not a later board-package edit, selects the 8 MB OPI SDK.
; Arduino-ESP32 undefines CONFIG_SPIRAM unless BOARD_HAS_PSRAM is set, which is
; why getPsramSize() stayed 0 on earlier images.
board_build.arduino.memory_type = qio_opi
build_flags = -DWLS_OUI_EMBEDDED -DBOARD_HAS_PSRAM
; SensorLib 0.1.6 is vendored under lib/SensorLib. The PlatformIO registry
; spec lewisxhe/SensorLib@0.1.6 did not resolve on this machine, and the
; Git tag 0.1.6 was not used because the installed tree is the authoritative copy.

; Host-native tests compile the shared logic only. Arduino sources stay out.
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_flags = -std=gnu++17 -mconsole
lib_ignore = SensorLib
build_src_filter = +<UiPress.cpp> +<NetMath.cpp> +<PasswordBuffer.cpp> +<CandidatePlan.cpp> +<HostInventory.cpp> +<ScannerController.cpp> +<UiModel.cpp> +<NameRecord.cpp> +<Oui.cpp> +<OuiData.cpp> +<OuiEnricher.cpp> +<AppActions.cpp> +<InventoryExport.cpp> +<ResourceFormat.cpp> +<InventoryStore.cpp>

; Test-only image. The production environment does not define WLS_TEST_MODE.
[env:lilygo-t-display-s3-pro-hil]
extends = env:lilygo-t-display-s3-pro
build_flags = -DWLS_OUI_EMBEDDED -DBOARD_HAS_PSRAM -DWLS_TEST_MODE=1
